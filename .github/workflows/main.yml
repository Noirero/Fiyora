name: Fiyora Stable (manual)

# Manual, audited promotion. Never automatically publishes main on push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiyora-stable-publish
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and publish FIYORA Stable
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_CERT_SHA256: 'dfcb5468d7e280befbe5ffdb0b4fe04cc0ced10810abb5c5fdc7a4dd48d02935'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Enforce manual dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: Checkout exact dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable identity and release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$GITHUB_SHA" || { echo 'Dispatch SHA mismatch'; exit 1; }
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$SOURCE_SHA" = "$CURRENT_MAIN" || { echo 'main moved after dispatch'; exit 1; }

          # Publish only a correctly branded FIYORA Stable APK with its independent package ID.
          grep -Fq 'applicationId = "com.noirero.fiyora"' android/app/build.gradle.kts
          grep -Fq 'android:label="Fiyora Explorer"' android/app/src/main/AndroidManifest.xml
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Stable tag ${TAG} already exists; refusing overwrite."
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run Flutter regression tests
        run: flutter test

      - name: Apply existing flutter_avif_android CI workaround
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name FlutterAvifPlugin.java -print -quit 2>/dev/null || true)"
          if [ -n "$FILE" ]; then
            echo '// Workaround: duplicate class conflicts with Kotlin plugin.' > "$FILE"
          fi

      - name: Configure FIYORA Stable signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FIYORA_STABLE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.FIYORA_STABLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FIYORA_STABLE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.FIYORA_STABLE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"; do
            test -n "$value" || { echo 'FIYORA Stable signing secrets (FIYORA_STABLE_*) are incomplete'; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/fiyora-stable-signing.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=fiyora-stable-signing.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties android/app/fiyora-stable-signing.jks

      - name: Build stable release-mode APKs
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate \
            --split-debug-info=build/app/outputs/symbols --no-tree-shake-icons

      - name: Validate stable APK package and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          test "$ABIS" = arm64-v8a || { echo "Unexpected ABI(s): $ABIS"; exit 1; }
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERTS"
          # apksigner labels vary by version and signature scheme; compare the full digest.
          LC_ALL=C awk -v expected="$EXPECTED_CERT_SHA256" '
            /certificate SHA-256 digest:/ {
              digest = $0
              sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "", digest)
              sub(/[[:space:]]+$/, "", digest)
              seen = 1
              if (length(digest) != 64 || digest !~ /^[0-9A-Fa-f]+$/ ||
                  tolower(digest) != tolower(expected)) mismatch = 1
            }
            END { exit (!seen || mismatch) }
          ' <<< "$CERTS" || {
            echo 'FIYORA Stable signing certificate does not match the pinned identity.'
            exit 1
          }
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.noirero.fiyora'"
          cp "$APK" "dist/Fiyora-v${APP_VERSION}-arm64-v8a.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload immutable stable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fiyora-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: fiyora-stable-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Ensure main still matches the built source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT_MAIN" = "$SOURCE_SHA" || {
            echo 'main changed during build; refusing to publish stale Stable APK.'
            exit 1
          }

      - name: Publish public Fiyora Stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Fiyora ${{ env.APP_VERSION }}
          prerelease: false
          draft: false
          make_latest: true
          body: |
            Public Fiyora Stable release built manually from exact main commit `${{ env.SOURCE_SHA }}`.
            GitHub Actions run: `${{ github.run_id }}`, attempt `${{ github.run_attempt }}`.
            APKs are signed and checked in CI. A successful build does not prove physical-device behavior.
          files: dist/*
          fail_on_unmatched_files: true
