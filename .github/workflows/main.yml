name: main — Fiyora Stable (manual)

# Manual, audited promotion. Never automatically publishes main on push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiyora-stable-publish
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and publish FIYORA Stable
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - name: Enforce manual dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: Checkout exact dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable identity and release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$GITHUB_SHA" || { echo 'Dispatch SHA mismatch'; exit 1; }
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$SOURCE_SHA" = "$CURRENT_MAIN" || { echo 'main moved after dispatch'; exit 1; }

          # Do not publish an NFile-branded APK under the FIYORA Stable label.
          grep -Fq 'applicationId = "com.rubex.nfile"' android/app/build.gradle.kts
          grep -Fq 'android:label="Fiyora Explorer"' android/app/src/main/AndroidManifest.xml
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Stable tag ${TAG} already exists; refusing overwrite."
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run Flutter regression tests
        run: flutter test

      - name: Apply existing flutter_avif_android CI workaround
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name FlutterAvifPlugin.java -print -quit 2>/dev/null || true)"
          if [ -n "$FILE" ]; then
            echo '// Workaround: duplicate class conflicts with Kotlin plugin.' > "$FILE"
          fi

      - name: Configure stable NFile-compatible signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"; do
            test -n "$value" || { echo 'Stable signing secrets are incomplete'; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Build stable release-mode APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/app/outputs/symbols --no-tree-shake-icons

      - name: Validate stable APK package and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            test -s "$APK"
            "$APKSIGNER" verify --print-certs "$APK"
            "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.rubex.nfile'"
            cp "$APK" "dist/Fiyora-v${APP_VERSION}-${ABI}.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload immutable stable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fiyora-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: fiyora-stable-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Ensure main still matches the built source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT_MAIN" = "$SOURCE_SHA" || {
            echo 'main changed during build; refusing to publish stale Stable APK.'
            exit 1
          }

      - name: Publish public Fiyora Stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: Fiyora ${{ env.APP_VERSION }}
          prerelease: false
          draft: false
          make_latest: true
          body: |
            Public Fiyora Stable release built manually from exact main commit \`${{ env.SOURCE_SHA }}\`.
            GitHub Actions run: \`${{ github.run_id }}\`, attempt \`${{ github.run_attempt }}\`.
            APKs are signed and checked in CI. A successful build does not prove physical-device behavior.
          files: dist/*
          fail_on_unmatched_files: true
