name: AR-012 temporary partial-extraction reproduction (no release)

on:
  push:
    branches:
      - review/ar012-extraction-rollback-repro-20261105

permissions:
  contents: read

jobs:
  ar012-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - name: Resolve original lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency files unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Reproduce partial extraction rollback risk
        run: flutter test --no-pub test/archive_partial_extraction_rollback_test.dart
      - name: Full Flutter regression suite
        run: flutter test --no-pub
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Existing Flutter AVIF shim workaround on runner only
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name 'FlutterAvifPlugin.java' 2>/dev/null | head -1 || true)"
          if [[ -n "$FILE" ]]; then
            printf '// CI-only shim: Kotlin owns FlutterAvifPlugin\\n' > "$FILE"
          fi
      - name: Compile Android debug ARM64 without release
        run: flutter build apk --debug --target-platform android-arm64 --no-tree-shake-icons
      - name: Confirm local debug APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
