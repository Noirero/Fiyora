name: AR-003 temporary decode-failure validation (no release)

on:
  push:
    branches:
      - review/ar003-decode-failure-preservation-20261105

permissions:
  contents: read

jobs:
  ar003-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - name: Resolve original lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency lockfile untouched
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-003 preservation tests
        run: flutter test --no-pub test/archive_decode_failure_preservation_test.dart
      - name: Full Flutter suite
        run: flutter test --no-pub
