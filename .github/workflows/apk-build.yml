name: APK Build

on:
  push:
    branches:
      - apk-beta
      - apk-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch flutter_avif_android duplicate class
        run: |
          FILE=$(find "$HOME/.pub-cache" -name "FlutterAvifPlugin.java" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "// Cleared to resolve redeclaration conflict with Kotlin file in same package" > "$FILE"
          fi

      - name: Build installable debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
