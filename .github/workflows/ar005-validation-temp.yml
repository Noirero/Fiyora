name: AR-005 temporary overwrite prevention tests (no release)

on:
  push:
    branches:
      - review/ar005-prevent-silent-overwrite-20261105

permissions:
  contents: read

jobs:
  ar005-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - name: Resolve original lockfile
        run: flutter pub get --enforce-lockfile
      - name: Keep dependency pins unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-005 no-overwrite regressions
        run: flutter test --no-pub test/archive_no_overwrite_test.dart
      - name: Full Flutter regression suite
        run: flutter test --no-pub
