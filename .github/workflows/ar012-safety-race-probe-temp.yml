name: AR-012 temporary ownership-race proof (no release)
on:
  push:
    branches:
      - review/ar012-extraction-rollback-repro-20261105
permissions:
  contents: read
jobs:
  ownership-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Verify unchanged dependency lockfile
        run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-012 rollback ownership tests
        run: flutter test --no-pub test/archive_partial_extraction_rollback_test.dart
