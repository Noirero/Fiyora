name: Fiyora PR Build Check

# Only validates changes; it cannot publish GitHub Releases.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fiyora-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test (no production signing)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Apply existing flutter_avif_android CI workaround
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name FlutterAvifPlugin.java -print -quit 2>/dev/null || true)"
          if [ -n "$FILE" ]; then
            echo '// Workaround: duplicate class conflicts with Kotlin plugin.' > "$FILE"
          fi

      - name: Generate throwaway CI signing key for release-mode compilation
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -storetype JKS -keyalg RSA -keysize 2048 \
            -validity 2 -alias ci-only -dname 'CN=CI,O=Fiyora,C=ID' \
            -keystore android/app/ci-only.jks -storepass ci-only-pass -keypass ci-only-pass
          cat > android/key.properties <<'EOF'
          storePassword=ci-only-pass
          keyPassword=ci-only-pass
          keyAlias=ci-only
          storeFile=ci-only.jks
          EOF

      - name: Compile Android release flavor (check only)
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Verify nonproduction artifact is produced
        run: test -s build/app/outputs/flutter-apk/app-release.apk
