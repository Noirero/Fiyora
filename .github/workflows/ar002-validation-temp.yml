name: AR-002 temporary extraction validation (no release)

on:
  push:
    branches:
      - review/ar002-extraction-containment-20261105

permissions:
  contents: read

jobs:
  ar002-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Resolve original lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify dependencies unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-002 security tests
        run: flutter test --no-pub test/archive_extraction_safety_test.dart
      - name: Full Flutter regression suite
        run: flutter test --no-pub
