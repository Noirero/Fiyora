name: apk-build (NFile Original)

# Only the workflow lives on main. The source is an immutable, audited NFile snapshot.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfile-original-publish
  cancel-in-progress: false

jobs:
  original:
    name: Build untouched NFile source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ORIGINAL_SHA: 00dcc955bbb0af0c0b0d963f644e6980d1ed67e5
    steps:
      - name: Confirm original branch has not moved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/apk-build" --jq .object.sha)"
          test "$CURRENT" = "$ORIGINAL_SHA" || {
            echo "apk-build moved from original source $ORIGINAL_SHA to $CURRENT. Review explicitly before updating the immutable baseline."
            exit 1
          }

      - name: Checkout frozen NFile source (not Fiyora)
        uses: actions/checkout@v4
        with:
          ref: 00dcc955bbb0af0c0b0d963f644e6980d1ed67e5
          persist-credentials: false

      - name: Validate original identity and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SHA"
          grep -Fq 'applicationId = "com.rubex.nfile"' android/app/build.gradle.kts
          grep -Fq 'android:label="NFile"' android/app/src/main/AndroidManifest.xml
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=nfile-original-v${VERSION}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Apply existing flutter_avif_android CI workaround
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name FlutterAvifPlugin.java -print -quit 2>/dev/null || true)"
          if [ -n "$FILE" ]; then
            echo '// Workaround: duplicate class conflicts with Kotlin plugin.' > "$FILE"
          fi

      - name: Configure original NFile signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"; do
            test -n "$value" || { echo 'Original signing secrets are incomplete'; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Build original ABI-split APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/app/outputs/symbols --no-tree-shake-icons

      - name: Verify identity, signing, architectures and checksums
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            test -s "$APK"
            "$APKSIGNER" verify --print-certs "$APK"
            "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.rubex.nfile'"
            cp "$APK" "dist/NFile-original-v${APP_VERSION}-${ABI}.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nfile-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Publish original NFile snapshot (not Fiyora stable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.ORIGINAL_SHA }}
          name: NFile Original ${{ env.APP_VERSION }}
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Untouched NFile source tree: `${{ env.ORIGINAL_SHA }}` (`apk-build` frozen baseline).
            Only the external build workflow is new; app source is not edited.
            This is **not** a Fiyora stable release.
          files: dist/*
          fail_on_unmatched_files: true
