name: AR-011 temporary archive capability validation (no release)

on:
  push:
    branches:
      - review/ar011-archive-format-capability-20261105

permissions:
  contents: read

jobs:
  ar011-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - name: Resolve original dependency lockfile
        run: flutter pub get --enforce-lockfile
      - name: Verify dependency files unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-011 format-capability tests
        run: flutter test --no-pub test/archive_format_capability_test.dart
      - name: Full Flutter regression tests
        run: flutter test --no-pub
      - name: Set up Java for Android debug compilation
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Existing AVIF Java shim workaround in runner only
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name 'FlutterAvifPlugin.java' 2>/dev/null | head -1 || true)"
          if [[ -n "$FILE" ]]; then
            printf '// CI-only workaround: Kotlin owns FlutterAvifPlugin\\n' > "$FILE"
          fi
      - name: Compile Android debug ARM64 (no publish)
        run: flutter build apk --debug --target-platform android-arm64 --no-tree-shake-icons
      - name: Confirm debug APK remains runner-local
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
