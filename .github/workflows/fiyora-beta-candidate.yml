name: FIYORA Beta Candidate (signed ARM64, artifact only)
on:
  push:
    branches:
      - ci/fiyora-beta-cf6a0dd
    paths:
      - .github/workflows/fiyora-beta-candidate.yml
permissions:
  contents: read
jobs:
  signed_arm64_beta:
    name: Build signed FIYORA Beta ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout beta candidate workspace
        uses: actions/checkout@v4
      - name: Restore exact reviewed five-AR source
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --check .fiyora-ci/FIYORA_FINAL_cf6a0dd.patch
          git apply --index .fiyora-ci/FIYORA_FINAL_cf6a0dd.patch
          git rm --cached -q .fiyora-ci/FIYORA_FINAL_cf6a0dd.patch .github/workflows/fiyora-beta-candidate.yml
          ACTUAL="$(git write-tree)"
          echo "Resulting source tree: $ACTUAL"
          test "$ACTUAL" = "ae349535b46686485d71d8824cdf17bac2dac475"
          grep -Fq 'applicationId = "com.noirero.fiyora.preview"' android/app/build.gradle.kts
          grep -Fq 'android:label="Fiyora Explorer Beta"' android/app/src/main/AndroidManifest.xml
          echo "Exact FIYORA five-AR HEAD cf6a0dd source verified"
      - name: Set build number for upgradable signed beta
        shell: bash
        run: |
          set -euo pipefail
          # Official beta workflow used 200000 + run number. Keep new release above it.
          echo "BUILD_NUMBER=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Restore locked Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply existing flutter_avif_android duplicate-class workaround
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "$HOME/.pub-cache" -name FlutterAvifPlugin.java -print -quit 2>/dev/null || true)"
          if [ -n "$FILE" ]; then
            echo '// Workaround: duplicate class conflicts with Kotlin plugin.' > "$FILE"
          fi
      - name: Configure official FIYORA Beta signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MRARE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MRARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MRARE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MRARE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"; do
            test -n "$value" || { echo 'Official FIYORA Beta signing secrets unavailable; refusing unsigned or debug build'; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/fiyora-signing.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=fiyora-signing.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties android/app/fiyora-signing.jks
      - name: Build optimized signed release ARM64
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number "$BUILD_NUMBER" --no-tree-shake-icons
      - name: Verify signature, ARM64, package, and record size
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.noirero.fiyora.preview'"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          test "$ABIS" = arm64-v8a || { echo "Unexpected ABI(s): $ABIS"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/FIYORA-beta-cf6a0dd-signed-arm64-v8a.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          du -h dist/*.apk
          cat dist/SHA256SUMS.txt
      - name: Upload signed beta APK (internal artifact only, no release)
        uses: actions/upload-artifact@v4
        with:
          name: FIYORA-beta-cf6a0dd-signed-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 14
