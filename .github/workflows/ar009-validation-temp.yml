name: AR-009 temporary ZIP password validation (no release)

on:
  push:
    branches:
      - review/ar009-zip-password-confidentiality-20261105

permissions:
  contents: read

jobs:
  ar009-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Verify dependency lockfile
        run: flutter pub get --enforce-lockfile
      - name: Check dependency files unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Targeted AR-009 confidentiality tests
        run: flutter test --no-pub test/archive_zip_password_confidentiality_test.dart
      - name: Full Flutter tests
        run: flutter test --no-pub
