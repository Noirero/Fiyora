name: FIYORA Diagnostics Beta Validation

on:
  push:
    branches:
      - feature/diagnostic-logger-observability-20261112

permissions:
  contents: read

jobs:
  diagnostics-beta:
    name: Test and Build ARM64 Debug APK (No Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch pre-existing flutter_avif_android duplicate Java class
        run: |
          FILE=$(find "$HOME/.pub-cache" -name "FlutterAvifPlugin.java" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "// Duplicate class cleared; Kotlin implementation remains." > "$FILE"
          fi

      - name: Run targeted diagnostic tests
        run: flutter test test/diagnostic_logger_test.dart test/diagnostic_logger_observability_test.dart

      - name: Build arm64-v8a only debug APK (never release)
        run: flutter build apk --debug --split-per-abi --target-platform android-arm64 --no-tree-shake-icons

      - name: Verify APK contains ARM64 native libraries only
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86_64|x86|arm64-v8a-unknown)/'; then
            echo "Unexpected non-ARM64 native libraries in $APK"
            exit 1
          fi
          du -h "$APK"
          sha256sum "$APK"

      - name: Upload arm64-v8a test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: FIYORA-diagnostic-logger-observability-arm64-v8a-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7
          if-no-files-found: error
