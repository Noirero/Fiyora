name: FIYORA Diagnostics Beta Validation

on:
  push:
    branches:
      - feature/diagnostic-logger-20261112

permissions:
  contents: read

jobs:
  diagnostics-beta:
    name: Test and Build Debug APK (No Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Patch pre-existing flutter_avif_android duplicate Java class
        run: |
          FILE=$(find "$HOME/.pub-cache" -name "FlutterAvifPlugin.java" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "// Duplicate class cleared; Kotlin implementation remains." > "$FILE"
          fi

      - name: Run targeted diagnostic tests
        run: flutter test test/diagnostic_logger_test.dart

      - name: Build installable debug APK (never release)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: FIYORA-diagnostic-logger-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
